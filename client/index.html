    <!--
      Catalyst Web SDK. Provides the embedded sign-in form and the browser-side
      session check (catalyst.auth.*). Both scripts are required, in this order:
      the CDN bundle defines the SDK, and /__catalyst/sdk/init.js is generated
      per project and supplies the project configuration.

      Neither script carries an OAuth client secret or an API token. The session
      they establish is a cookie the browser holds; every Zoho API call still
      happens server-side inside the Catalyst function.
    -->
